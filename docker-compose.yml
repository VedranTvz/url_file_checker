services:
 db_service:
  image: mysql:8
  environment:
   MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
   MYSQL_DATABASE: ${DB_NAME}
  volumes:
     - mysql_data:/var/lib/mysql
     - ./DB/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
     

 back_service:
  image: vedrantvz/file-checker-backend:latest
  container_name: file-checker-backend
  ports:
   - "3000:3000"
  env_file:
   - .env
  depends_on:
   - db_service
  restart: always

 front_service:
  image: vedrantvz/file-checker-frontend:latest
  container_name: file-checker-frontend
  ports:
    - "5173:5173"
  depends_on:
    - back_service
  restart: always

volumes:
 mysql_data:

   