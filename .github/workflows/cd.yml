name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: Start app
        run: |
          docker run -d -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/file-checker-backend
          docker run -d -p 5173:5173 ${{ secrets.DOCKER_USERNAME }}/file-checker-frontend
          sleep 20
          docker ps -a

      - name: ZAP scan frontend
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:5173"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-r frontend.html"

      - name: ZAP scan backend
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:3000"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-r backend.html"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
            frontend.html
            backend.html
          if-no-files-found: warn
