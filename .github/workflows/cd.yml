name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: Start app
        run: |
          docker run -d --name backend -p 3000:3000 \
            -e PORT=3000 \
            -e VIRUSTOTAL_API_KEY="${{ secrets.VIRUSTOTAL_API_KEY }}" \
            -e DB_HOST="${{ secrets.DB_HOST }}" \
            -e DB_PORT=3306 \
            -e DB_USER="${{ secrets.DB_USER }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e DB_NAME=file_checker \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
            ${{ secrets.DOCKER_USERNAME }}/file-checker-backend:latest

          docker run -d --name frontend -p 5173:5173 \
            ${{ secrets.DOCKER_USERNAME }}/file-checker-frontend:latest

          sleep 20
          docker ps -a
          docker logs backend

      - name: ZAP scan frontend
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:5173"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-r frontend.html"

      - name: ZAP scan backend
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:3000"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-r backend.html"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            frontend.html
            backend.html
          if-no-files-found: warn
