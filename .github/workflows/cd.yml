name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: Start app
        run: |
          docker run -d -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/file-checker-backend
          docker run -d -p 8080:5173 ${{ secrets.DOCKER_USERNAME }}/file-checker-frontend
          sleep 20

      - name: ZAP scan frontend
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5173"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-frontend

      - name: ZAP scan backend
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-backend
